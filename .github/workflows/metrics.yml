name: Metrics
on:
  schedule: [{ cron: "0 0 * * *" }]   # daily
  workflow_dispatch:                  # lets you run it manually
  push: { branches: ["main"] }

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: jbitterz
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Manila

          # 3D contributions calendar
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # Commit habits — simpler mode, look further back
          plugin_habits: yes
          plugin_habits_charts: no
          plugin_habits_facts: yes
          plugin_habits_from: 200
          plugin_habits_days: 30

          # remove achievements
          plugin_achievements: no

          # Most used languages bar
          plugin_languages: yes
          plugin_languages_details: percentage

          # Lines added/removed
          plugin_lines: yes

          # "Mastered technologies" icon grid (based on topics of repos you star)
          plugin_topics: yes
          plugin_topics_mode: icons
          plugin_topics_limit: 0

          # Achievement badges
          plugin_achievements_display: compact
